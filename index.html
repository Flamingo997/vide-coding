<button class="back-top" id="backTop" aria-label="回到顶部">↑</button>

<script>
  let NEWS, NEWS_FLASH, POSTER_MAP, WIDE_POSTER_MAP, TYPE_MAP, EVENT_NAME, TYPE_BG, TIMES, WEEKDAYS;

  let currentView = 'home';
  let currentType = 'all';
  let currentRange = 'all';
  let keyword = '';

  // ======= 统一日期工具：彻底规避 UTC 时区偏差 + NaN 污染 sort =======
  // 1) parseYMDLocal(str): 手动拆分 Y/M/D，用本地时区 new Date(y, m-1, d) 构造
  //    解析失败返回 null，绝不返回 Invalid Date
  function parseYMDLocal(str) {
    if (str === undefined || str === null) return null;
    const s = String(str).trim();
    if (!s) return null;
    // 兼容: YYYY-MM-DD / YYYY/MM/DD / YYYY.MM.DD / YYYYMMDD
    const m = s.match(/^(\d{4})[-/.]?(\d{1,2})[-/.]?(\d{1,2})/);
    if (!m) return null;
    const y = parseInt(m[1], 10);
    const mo = parseInt(m[2], 10);
    const d = parseInt(m[3], 10);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    const dt = new Date(y, mo - 1, d, 0, 0, 0, 0);
    // 防御非法日期（例如 2月30日）：检查反向是否匹配
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return dt;
  }
  // 2) parseDateTs(str): 返回「当日 00:00 本地时间戳」，解析失败返回 0
  //    保证永远是合法数字 → sort 绝不会被 NaN 污染
  function parseDateTs(str) {
    const d = parseYMDLocal(str);
    return d ? d.getTime() : 0;
  }
  // 3) toStdDate(str): 标准化为 'YYYY-MM-DD' 字符串，用于分组键，保证同一天不拆分多组
  //    解析失败返回原字符串（兜底）
  function toStdDate(str) {
    const d = parseYMDLocal(str);
    if (!d) return String(str || '');
    const y = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${mo}-${dd}`;
  }
  // 今日基准：本地时区 00:00:00 的时间戳，避免时分秒影响 diffDays 计算
  const TODAY = (() => {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0, 0, 0, 0);
  })();
  const TODAY_TS = TODAY.getTime();
  const DAY_MS = 86400000;

  function inRange(dateStr, range) {
    const ts = parseDateTs(dateStr);
    if (ts === 0) return range === 'all'; // 日期无效：只有全量才显示
    const diffDays = Math.round((ts - TODAY_TS) / DAY_MS);
    if (range === 'week')     return diffDays >= -7 && diffDays <= 0;
    if (range === 'month')    return diffDays >= -30 && diffDays <= 0;
    if (range === 'upcoming') return diffDays > 0;
    return true;
  }

  function dayLabel(dateStr) {
    const d = parseYMDLocal(dateStr);
    if (!d) return String(dateStr || '日期未知');
    // 如果与今年不同，加上年份（跨年数据一眼可辨）
    const sameYear = d.getFullYear() === TODAY.getFullYear();
    const head = sameYear
      ? ((d.getMonth() + 1) + '月' + d.getDate() + '日')
      : (d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日');
    return head + ' ' + WEEKDAYS[d.getDay()];
  }

  function pseudoBox(title, seed) {
    let h = seed * 7919;
    for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) % 100000;
    return 300 + (h % 4700);
  }

  // 待滚动定位的影片标题（renderTimeline 渲染完成后消费）
  let pendingScrollTitle = null;

  function goView(view, type, title) {
    currentView = view;
    currentType = type || 'all';
    // 只有明确传了 title 才消费性定位，其他入口不设置
    pendingScrollTitle = title || null;
    document.getElementById('homeView').hidden = view !== 'home';
    document.getElementById('tlView').hidden = view !== 'timeline';

    // 视图切换过渡动画（淡入 + 上移）
    const showEl = view === 'home' ? document.getElementById('homeView') : document.getElementById('tlView');
    showEl.classList.remove('view-enter');
    void showEl.offsetWidth; // 强制重排以重启动画
    showEl.classList.add('view-enter');

    const themeColor = view === 'timeline' && currentType !== 'all'
      ? TYPE_MAP[currentType].color : '#2F86FF';
    document.documentElement.style.setProperty('--theme', themeColor);
    document.body.style.background = view === 'timeline'
      ? (TYPE_BG[currentType] || TYPE_BG.all) : TYPE_BG.all;

    document.querySelectorAll('.nav-item, .more-menu a').forEach(a => {
      a.classList.toggle('active', a.dataset.view === view && (a.dataset.type || '') === (view === 'home' ? '' : currentType));
    });

    if (view === 'timeline') {
      document.getElementById('tlTitle').textContent =
        currentType === 'all' ? '全量时间线' : TYPE_MAP[currentType].name;
      renderTimeline(document.getElementById('timeline'), { type: currentType, range: currentRange, keyword });
    } else {
      pendingScrollTitle = null; // 切首页就不需要了
      window.scrollTo({ top: 0, behavior: 'auto' });
    }
  }

  document.querySelectorAll('.nav-item, .more-menu a, .brand').forEach(el => {
    el.addEventListener('click', () => goView(el.dataset.view, el.dataset.type));
  });

  document.querySelectorAll('#rangeRow .pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('#rangeRow .pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      currentRange = p.dataset.range;
      renderTimeline(document.getElementById('timeline'), { type: currentType, range: currentRange, keyword });
    });
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    keyword = e.target.value.trim();
    if (keyword && currentView === 'home') { goView('timeline', 'all'); return; }
    if (currentView === 'timeline') {
      renderTimeline(document.getElementById('timeline'), { type: currentType, range: currentRange, keyword });
    }
  });

  // ============ 轮播 Banner：每个分类各取最新1条 ============
  function initBanner() {
    // 按分类各取最新的1条，确保 Banner 覆盖所有分类
    const BANNER_TYPES = ['movie', 'drama', 'show', 'anime', 'doc', 'duan'];
    const BANNER_ITEMS = BANNER_TYPES
      .map(type => {
        // 该分类按日期降序取最新1条
        const items = NEWS
          .filter(n => n.type === type)
          .sort((a, b) => parseDateTs(b.date) - parseDateTs(a.date));
        return items[0];
      })
      .filter(Boolean) // 去掉空分类
      .map(n => {
        const poster = n.poster || POSTER_MAP[n.title];
        const wide = n.widePoster || WIDE_POSTER_MAP[n.title] || null;
        const cleanTitle = n.title.replace(/》定档.*$/, '》');
        return {
          title: cleanTitle,
          poster,
          wide,
          type: n.type,
          summary: n.detail?.intro || n.summary,
          color: TYPE_MAP[n.type].color
        };
      });

    if (BANNER_ITEMS.length === 0) return;

    const slidesEl = document.getElementById('slides');
    const dotsEl = document.getElementById('dots');
    let slideIdx = 0;
    let slideTimer = null;

    slidesEl.innerHTML = BANNER_ITEMS.map((n, i) => {
      if (n.wide) {
        return `
          <div class="slide${i === 0 ? ' on' : ''}" style="background: linear-gradient(135deg, ${n.color}22, #1A1F2E);">
            <img src="${n.wide}" class="slide-bg" alt="${n.title}">
            <div class="slide-overlay"></div>
            <div class="slide-info">
              <span class="slide-tag" style="background:${n.color}">${TYPE_MAP[n.type].name}</span>
              <h2>${n.title}</h2>
              <p>${n.summary}</p>
            </div>
          </div>`;
      } else {
        return `
          <div class="slide${i === 0 ? ' on' : ''}" style="background: linear-gradient(135deg, ${n.color}dd 0%, ${n.color}88 40%, #1A1F2E 100%);">
            <div class="slide-with-poster">
              <div class="slide-poster-wrap">
                <img src="${n.poster}" class="slide-poster" alt="${n.title}">
                <div class="slide-poster-glow" style="box-shadow: 0 0 60px ${n.color}88;"></div>
              </div>
              <div class="slide-text-only">
                <span class="slide-tag" style="background:${n.color}">${TYPE_MAP[n.type].name}</span>
                <h2>${n.title}</h2>
                <p>${n.summary}</p>
              </div>
            </div>
          </div>`;
      }
    }).join('');

    dotsEl.innerHTML = BANNER_ITEMS.map((_, i) => `<span class="${i === 0 ? 'on' : ''}" data-i="${i}"></span>`).join('');

    function goSlide(i) {
      slideIdx = (i + BANNER_ITEMS.length) % BANNER_ITEMS.length;
      slidesEl.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
      dotsEl.querySelectorAll('span').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
    }
    function startAuto() { stopAuto(); slideTimer = setInterval(() => goSlide(slideIdx + 1), 5000); }
    function stopAuto() { if (slideTimer) clearInterval(slideTimer); }

    document.getElementById('prevBtn').addEventListener('click', () => goSlide(slideIdx - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goSlide(slideIdx + 1));
    dotsEl.querySelectorAll('span').forEach(s => s.addEventListener('click', () => goSlide(Number(s.dataset.i))));
    const bannerEl = document.getElementById('banner');
    bannerEl.addEventListener('mouseenter', stopAuto);
    bannerEl.addEventListener('mouseleave', startAuto);
    startAuto();
  }

  // 将影片标题转换为安全的 HTML id（保留中文，仅替换空格和特殊符号为下划线）
  function titleToId(title) {
    return 'tl-' + String(title || '').replace(/[\s"'<>\\\/&?#=%\[\].，,。！!？?；;：:（）()【】《》~·@$^*+\-|`]/g, '_');
  }

  function renderTimeline(container, opt) {
    const { type = 'all', range = 'all', keyword: kw = '', limit = 0 } = opt;
    // ========== 第1步：过滤 + 为每条预计算时间戳（避免 sort 里重复解析） ==========
    const withTs = NEWS.map(n => ({
      n,
      ts: parseDateTs(n.date),            // 数字：合法=当日0点时间戳；无效=0
      std: toStdDate(n.date),             // 字符串：YYYY-MM-DD 标准化分组键
      invalid: !parseYMDLocal(n.date)     // true=日期解析失败（方便日志和统计）
    }));
    let filtered = withTs.filter(o => {
      const { n: item } = o;
      const typeOk = type === 'all' || item.type === type;
      const rangeOk = inRange(item.date, range);
      const kwOk = !kw || item.title.includes(kw) || item.summary.includes(kw);
      return typeOk && rangeOk && kwOk;
    });
    // ========== 第2步：排序（核心修复！用纯数值 ts 比较 → 永远不会产生 NaN） ==========
    // 降序：ts 大（新）的在上，ts 小（旧）的在下；无效日期（ts=0）统一沉到最底部
    // 如果日期相同，再按 NEWS 原始索引排（保证同一日内顺序稳定）
    const origIdx = new Map(NEWS.map((n, i) => [n, i]));
    filtered.sort((a, b) => {
      if (a.ts !== b.ts) return b.ts - a.ts;
      const ia = origIdx.get(a.n) ?? 0;
      const ib = origIdx.get(b.n) ?? 0;
      return ib - ia;
    });

    if (limit > 0) filtered = filtered.slice(0, limit);

    // ========== 控制台排错日志：前 15 条 原date → 解析时间戳 → 标准日期 ==========
    // 解析失败的条目用 [DATE_INVALID] 高亮，用户一眼定位
    if (filtered.length > 0) {
      console.group('[时间轴排序调试] type=' + type + ' range=' + range + ' 共' + filtered.length + '条');
      filtered.slice(0, 15).forEach((o, i) => {
        const flag = o.invalid ? '%c[DATE_INVALID]%c' : '';
        const args = o.invalid ? ['color:white;background:#d33;padding:1px 6px;border-radius:3px', ''] : [];
        const datePart = o.invalid
          ? ` date="${o.n.date}"`
          : ` date="${o.n.date}" std=${o.std} ts=${o.ts}`;
        console.log.apply(console, [`  #${i + 1}${flag}${datePart}  ${o.n.title}`, ...args]);
      });
      const invCount = filtered.filter(o => o.invalid).length;
      if (invCount > 0) {
        console.log('%c⚠ 有 ' + invCount + ' 条日期解析失败（已沉底），请检查 TMDB 接口返回的 date 字段格式',
          'color:#b35900;background:#fff4e5;padding:4px 8px;border-radius:4px');
      }
      console.groupEnd();
    }

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-tip">当前筛选条件下暂无资讯</div>';
      pendingScrollTitle = null;
      return;
    }

    // ========== 第3步：按标准化日期分组（同一天的不拆组） ==========
    const groups = [];
    filtered.forEach(o => {
      const last = groups[groups.length - 1];
      if (last && last.stdDate === o.std) last.items.push(o);
      else groups.push({ stdDate: o.std, rawDate: o.n.date, items: [o] });
    });

    container.innerHTML = groups.map(g => `
      <section class="day-group">
        <h2 class="day-head">${dayLabel(g.rawDate)}</h2>
        ${g.items.map(o => {
          const n = o.n; // 从包装对象里取出原始条目
          const t = TYPE_MAP[n.type];
          if (!t) return '';
          const time = TIMES[(origIdx.get(n) ?? 0) % TIMES.length];
          const nodeCls = 'tl-node';
          const elId = titleToId(n.title);
          const safeTitle = n.title.replace(/"/g, '&quot;');
          // 日期解析失败的条目加小标红提示（可选，让用户肉眼看到格式有问题的卡片）
          const invalidBadge = o.invalid
            ? `<span style="font-size:11px;color:#fff;background:#d33;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle">日期异常</span>`
            : '';
          return `
            <div class="tl-item" style="--tc:${t.color}" id="${elId}" data-title="${safeTitle}">
              <div class="${nodeCls}"></div>
              <article class="card" onclick="toggleCard(this)">
                <div class="poster"><img src="${n.poster || POSTER_MAP[n.title]}" alt="${n.title}" loading="lazy"></div>
                <div class="card-main">
                  <div class="card-top">
                    <span class="card-time">${time} · ${EVENT_NAME[n.event]}</span>
                    <span class="tag-solid">${t.name}${invalidBadge}</span>
                  </div>
                  <h3 class="card-title">${n.title}<span class="detail-hint">点击卡片展开详情</span></h3>
                  <p class="card-summary">${n.summary}</p>
                  <div class="card-foot">
                    <span class="source">来源：${n.source}</span>
                    <a class="src-btn" href="${n.sourceLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看来源 →</a>
                  </div>
                  <div class="detail">
                    <p>${n.detail.intro}</p>
                    <div class="meta-line"><strong>主创：</strong>${n.detail.cast}</div>
                    <div class="meta-line"><strong>播出：</strong>${n.detail.platform}</div>
                    <div class="meta-line"><strong>规格：</strong>${n.detail.ep}</div>
                  </div>
                </div>
              </article>
            </div>`;
        }).join('')}
      </section>
    `).join('');

    // ========== 渲染完成：如果有待定位的影片标题，滚到该元素并短暂高亮 ==========
    if (pendingScrollTitle) {
      const target = document.getElementById(titleToId(pendingScrollTitle));
      const title = pendingScrollTitle; // 先存一份再清空
      pendingScrollTitle = null;
      if (target) {
        // 滚动到视口中央偏上一点，留出上方空间
        requestAnimationFrame(() => {
          const rect = target.getBoundingClientRect();
          const scrollTop = window.pageYOffset + rect.top - 120;
          window.scrollTo({ top: scrollTop, behavior: 'smooth' });
          // 给卡片加 1.8 秒的高亮闪烁效果
          const card = target.querySelector('.card');
          if (card) {
            card.animate([
              { boxShadow: '0 0 0 3px var(--tc), 0 10px 30px rgba(47,134,255,0.35)', transform: 'translateY(0) scale(1)' },
              { boxShadow: '0 0 0 4px var(--tc), 0 16px 40px rgba(47,134,255,0.45)', transform: 'translateY(-2px) scale(1.01)' },
              { boxShadow: '0 0 0 3px var(--tc), 0 10px 30px rgba(47,134,255,0.35)', transform: 'translateY(0) scale(1)' },
              { boxShadow: '0 0 0 0 rgba(47,134,255,0)', transform: 'translateY(0) scale(1)' }
            ], { duration: 1800, easing: 'ease-out' });
          }
        });
      }
    }
  }

  window.toggleCard = function (card) {
    card.querySelector('.detail').classList.toggle('open');
  };

  // ============ 首页：分品类上新卡片组（网格布局，无滚动条） ============
  function oneLineSummary(text) {
    if (!text || text.length < 2) return '暂无简介';
    let s = text.replace(/^《.+?》/, '').trim();
    // 分句：遇到句末标点就切，但若在引号配对中间则延后（把引号整体吞完再切）
    let cut = s;
    const quoteMap = { '"': '"', '“': '”', '‘': '’', '「': '」', '『': '』' };
    const closeMap = { '”': '“', '’': '‘', '」': '「', '』': '『' };
    const stack = [];
    let cutIdx = -1;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (quoteMap[ch]) { stack.push(ch); }
      else if (closeMap[ch]) { if (stack[stack.length - 1] === closeMap[ch]) stack.pop(); }
      else if (ch === '"') { if (stack[stack.length - 1] === '"') stack.pop(); else stack.push('"'); }
      if (stack.length === 0 && /[。.!?！？…]/.test(ch)) { cutIdx = i; break; }
    }
    if (cutIdx > 3) cut = s.slice(0, cutIdx + 1).trim();
    s = cut;

    // 引号闭合补全：保证返回结果的引号配对
    const stack2 = [];
    for (const ch of s) {
      if (quoteMap[ch]) { stack2.push(ch); }
      else if (closeMap[ch]) { if (stack2[stack2.length - 1] === closeMap[ch]) stack2.pop(); }
      else if (ch === '"') { if (stack2[stack2.length - 1] === '"') stack2.pop(); else stack2.push('"'); }
    }
    while (stack2.length) {
      const open = stack2.pop();
      s += quoteMap[open] || open;
    }
    return s;
  }
  function renderCatGroups() {
    const order = ['movie', 'drama', 'show', 'anime', 'duan', 'doc'];
    document.getElementById('catGroups').innerHTML = order.map(type => {
      const t = TYPE_MAP[type];
      // 首页卡片同样用 parseDateTs 数值排序 → 永不 NaN，日期新的在前，无效日期沉底
      const items = NEWS.filter(n => n.type === type)
        .sort((a, b) => parseDateTs(b.date) - parseDateTs(a.date)).slice(0, 8);
      if (!items.length) return '';
      return `
        <section class="block cat-group">
          <div class="cat-head">
            <h2 class="block-title" style="color:${t.color}">${t.name}</h2>
            <a class="more-link" data-type="${type}">查看更多 →</a>
          </div>
          <div class="cat-grid">
            ${items.map(n => {
              const cleanTitle = n.title.replace(/》.*$/, '》');
              const desc = oneLineSummary(n.summary);
              const safeTitle = n.title.replace(/"/g, '&quot;');
              return `
              <div class="cat-card" data-type="${type}" data-title="${safeTitle}">
                <div class="cat-poster-wrap">
                  <img src="${n.poster || POSTER_MAP[n.title]}" alt="${n.title}" loading="lazy">
                </div>
                <div class="cat-card-info">
                  <div class="cat-card-title">${cleanTitle}</div>
                  <div class="cat-card-desc">${desc}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </section>`;
    }).join('');
    // 「查看更多」仅跳转该分类时间线（滚到顶部）
    document.querySelectorAll('.more-link').forEach(el => {
      el.addEventListener('click', () => goView('timeline', el.dataset.type));
    });
    // 首页卡片：跳转分类时间线 + 滚动定位到对应的影片条目并高亮
    document.querySelectorAll('.cat-card').forEach(el => {
      el.addEventListener('click', () => goView('timeline', el.dataset.type, el.dataset.title));
    });
  }

  // ============ 首页边栏：票房榜 + 大盘 + 资讯（优化版） ============
  function renderSidebar() {
    const movies = NEWS.filter(n => n.type === 'movie' && n.event === 'online')
      .sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
    let sum = 0;
    document.getElementById('boxOffice').innerHTML = movies.map((n, i) => {
      const box = pseudoBox(n.title, i + 1);
      sum += box;
      const name = n.title.replace(/《(.+?)》.*/, '$1');
      const poster = n.poster || POSTER_MAP[n.title];
      if (i === 0) {
        return `
          <div class="bo-item bo-top">
            <div class="bo-top-poster">
              <img src="${poster}" alt="${name}">
              <span class="bo-rank top3 big">1</span>
            </div>
            <div class="bo-top-info">
              <div class="bo-top-name">${name}</div>
              <div class="bo-top-box">${box}万 <span class="bo-trend">↑ 热映中</span></div>
            </div>
          </div>`;
      }
      return `
        <div class="bo-item">
          <span class="bo-rank${i < 3 ? ' top3' : ''}">${i + 1}</span>
          <span class="bo-name">${name}</span>
          <span class="bo-num">${box}万</span>
        </div>`;
    }).join('') || '<div class="empty-tip">暂无数据</div>';

    document.getElementById('marketNum').textContent = (sum * 2.6 / 10000).toFixed(2) + ' 亿';
    const now = new Date();
    document.getElementById('marketMeta').textContent =
      `更新于 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} · 数据来源：灯塔/猫眼`;

    document.getElementById('flashList').innerHTML = NEWS_FLASH.map((f, i) => `
      <div class="flash-item">
        <span class="flash-dot"></span>
        <span class="flash-content">
          <span class="flash-title">${f.title}</span>
          <span class="flash-time">${f.time}</span>
        </span>
      </div>`).join('');

    adjustSideSpacer();
  }

  function adjustSideSpacer() {
    const homeMain = document.querySelector('.home-main');
    const homeSide = document.querySelector('.home-side');
    const spacer = document.getElementById('sideSpacer');
    if (!homeMain || !homeSide || !spacer) return;
    const mainH = homeMain.getBoundingClientRect().height;
    const sideH = homeSide.getBoundingClientRect().height - spacer.getBoundingClientRect().height;
    const gap = parseFloat(getComputedStyle(document.querySelector('.home-layout')).gap) || 28;
    // 侧栏总高度补齐到接近左侧主内容高度，使其能跟随滚动直到底部
    const needed = Math.max(0, mainH - sideH - gap);
    spacer.style.height = needed + 'px';
  }

  window.addEventListener('load', adjustSideSpacer);
  window.addEventListener('resize', adjustSideSpacer);

  document.getElementById('boxOfficeMore').addEventListener('click', () => goView('timeline', 'movie'));
  document.getElementById('marketCard').addEventListener('click', () => {
    window.open('https://piaofang.maoyan.com/dashboard/movie', '_blank');
  });

  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    backTop.classList.toggle('show', window.scrollY > 400);
  });
  backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      ({ NEWS, NEWS_FLASH, POSTER_MAP, WIDE_POSTER_MAP, TYPE_MAP, EVENT_NAME, TYPE_BG, TIMES, WEEKDAYS } = data);
      // 并行请求 TMDB 全部分类 + HOSHIYOMI 短剧，两者任意失败都不影响另一方
      return Promise.allSettled([
        fetch('/api/tmdb?v=7').then(r => r.ok ? r.json() : null).catch(() => null),
        fetch('/api/shortdrama?limit=16').then(r => r.ok ? r.json() : null).catch(() => null)
      ]).then(([tmdbRes, shortRes]) => {
        const tmdbData = (tmdbRes.status === 'fulfilled' && tmdbRes.value && tmdbRes.value.code === 0 && tmdbRes.value.data) || [];
        const shortData = (shortRes.status === 'fulfilled' && shortRes.value && shortRes.value.code === 0 && shortRes.value.data) || [];
        // 合并：TMDB 各分类 + HOSHIYOMI 短剧接口 + data.json 里的静态短剧条目
        const staticDuan = (data.NEWS || []).filter(n => n.type === 'duan');
        NEWS = tmdbData.concat(shortData).concat(staticDuan);
      });
    })
    .then(() => {
      initBanner();
      renderCatGroups();
      renderSidebar();
    });
</script>
