<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影上新 · 全平台影视上新资讯时间线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #FAFAFA;
    --primary: #2F86FF;
    --accent: #FF7D29;
    --text-dark: #1F2329;
    --text-mid: #6B7280;
    --text-light: #9CA3AF;
    --line: #E5E7EB;
    /* 五级灰度体系 */
    --gray-1: #F5F6F7;
    --gray-2: #E5E7EB;
    --gray-3: #9CA3AF;
    --gray-4: #6B7280;
    --gray-5: #1F2329;
    --card-shadow: 0 4px 16px rgba(31,35,41,0.06);
    --card-shadow-hover: 0 10px 28px rgba(31,35,41,0.12);
  }
  body {
    background: var(--bg);
    color: var(--text-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }

  /* ===== 顶部导航栏 ===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250,250,250,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: 1px;
  }
  .slogan {
    font-size: 13px;
    color: var(--text-mid);
  }
  /* 极简搜索框 */
  .search-box { margin-left: auto; position: relative; align-self: center; }
  .search-box input {
    width: 210px;
    padding: 7px 14px 7px 32px;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    outline: none;
    font-family: inherit;
    color: var(--text-dark);
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .search-box input::placeholder { color: var(--gray-3); }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(47,134,255,0.12);
  }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.45;
    pointer-events: none;
  }

  /* ===== 筛选区 ===== */
  .filter-bar {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 24px 8px;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filter-label {
    font-size: 13px;
    color: var(--text-light);
    margin-right: 4px;
    flex-shrink: 0;
  }
  /* 胶囊按钮：未选中浅灰底，选中主色填充 */
  .chip {
    padding: 7px 18px;
    font-size: 13px;
    border-radius: 999px;
    border: none;
    background: var(--gray-1);
    color: var(--gray-4);
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
  }
  .chip:hover { background: var(--gray-2); color: var(--primary); }
  .chip.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(47,134,255,0.28);
  }

  /* ===== 时间线 ===== */
  .timeline-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    position: relative;
  }
  /* 贯穿主线：浅灰细虚线 */
  .timeline-wrap::before {
    content: '';
    position: absolute;
    left: 60px;
    top: 24px;
    bottom: 80px;
    width: 0;
    border-left: 2px dashed var(--line);
  }
  .tl-item {
    position: relative;
    padding-left: 96px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .tl-item.visible { opacity: 1; transform: translateY(0); }
  /* 时间节点 */
  .tl-node {
    position: absolute;
    left: 53px;
    top: 24px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--primary);
    z-index: 2;
  }
  .tl-node.pending {
    background: #fff;
    box-shadow: 0 0 0 2px var(--primary);
  }
  /* 日期标签 */
  .tl-date {
    position: absolute;
    left: 0;
    top: 18px;
    width: 44px;
    text-align: right;
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.4;
  }
  .tl-date .day { font-size: 16px; font-weight: 700; color: var(--text-dark); }
  .tl-date .month { font-size: 11px; color: var(--text-light); }

  /* ===== 资讯卡片（封面卡片化） ===== */
  .card {
    display: flex;
    gap: 18px;
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--card-shadow);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .card:hover {
    box-shadow: var(--card-shadow-hover);
    transform: translateY(-3px);
  }
  /* 2:3 竖版海报封面 */
  .poster {
    width: 108px;
    flex-shrink: 0;
    align-self: flex-start;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: var(--gray-1);
  }
  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .card:hover .poster img { transform: scale(1.06); }
  .card-body { flex: 1; min-width: 0; }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  /* 类型标签：胶囊式浅底彩字 */
  .tag {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: 999px;
  }
  .tag-movie { background: #FFF0E6; color: #FF7D29; }      /* 院线电影-暖橙 */
  .tag-drama { background: #E6F2FF; color: #2F86FF; }      /* 电视剧-晴空蓝 */
  .tag-show  { background: #FFE6F0; color: #EC4899; }      /* 综艺-玫粉 */
  .tag-anime { background: #E6F7ED; color: #22C55E; }      /* 动漫-草绿 */
  .tag-doc   { background: #F3EEFF; color: #8B5CF6; }      /* 纪录片-紫 */
  /* 事件属性 */
  .event-badge {
    font-size: 11px;
    color: var(--text-light);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .event-badge.online { color: var(--primary); border-color: var(--primary); }
  .event-badge.advance { color: var(--accent); border-color: var(--accent); }
  /* 第一层级：标题，最多 2 行截断 */
  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.5;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* 第三层级：摘要 2 行截断 */
  .card-summary {
    font-size: 14px;
    color: var(--text-mid);
    line-height: 1.7;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-foot {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .source {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--text-light);
  }
  .source a {
    color: var(--text-light);
    text-decoration: none;
    border-bottom: 1px dashed var(--line);
    transition: color 0.15s;
  }
  .source a:hover { color: var(--primary); }
  /* 第三层级：时间，浅灰弱化 */
  .card-date {
    font-size: 12px;
    color: var(--text-light);
    flex-shrink: 0;
  }
  .detail-btn {
    font-size: 13px;
    color: var(--primary);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 8px;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .detail-btn:hover { opacity: 0.7; }
  /* 详情展开区 */
  .detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease;
    border-top: 1px solid transparent;
  }
  .detail.open {
    max-height: 600px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .detail h4 {
    font-size: 13px;
    color: var(--text-dark);
    margin-bottom: 8px;
  }
  .detail p {
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.8;
    margin-bottom: 10px;
  }
  .detail .meta-line {
    font-size: 12px;
    color: var(--text-light);
  }
  .detail .meta-line strong { color: var(--text-mid); font-weight: 600; }

  .empty-tip {
    text-align: center;
    color: var(--text-light);
    padding: 60px 0;
    font-size: 14px;
  }

  /* ===== 底部说明 ===== */
  .footer {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 48px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .footer .demo-tag {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    background: #FFF0E6;
    padding: 3px 12px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .footer p {
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.8;
  }
  .footer .version {
    margin-top: 10px;
    font-weight: 600;
    color: var(--gray-4);
  }

  /* ===== 回到顶部 ===== */
  .back-top {
    position: fixed;
    right: 32px;
    bottom: 32px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(47,134,255,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 90;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-top.show { opacity: 1; pointer-events: auto; }
  .back-top:hover { transform: translateY(-3px); }
</style>
</head>

      source: '腾讯视频纪录片官博',
      sourceLink: 'https://weibo.com/',
      detail: {

  // ============ 类型/事件映射 ============
  const TYPE_MAP = {
    movie: { name: '院线电影', tag: 'tag-movie' },
    drama: { name: '电视剧',   tag: 'tag-drama' },
    show:  { name: '综艺',    tag: 'tag-show' },
    anime: { name: '动漫',    tag: 'tag-anime' },
    doc:   { name: '纪录片',  tag: 'tag-doc' }
  };
  const EVENT_MAP = {
    online:   { name: '上线', cls: 'online' },
    schedule: { name: '定档', cls: '' },
    advance:  { name: '提档', cls: 'advance' }
  };

  // ============ 海报封面（本地文件，按标题映射） ============
  const POSTER_MAP = {
    '《长安霓裳录》全网首播': 'posters/01_chang_an.jpg',
    '《深海回响》全国院线上映': 'posters/02_shen_hai.jpg',
    '《声浪2026》第三季回归开播': 'posters/03_sheng_lang.jpg',
    '《雾山行》国产动画第二季上线': 'posters/04_wu_shan.jpg',
    '《逆光行者》定档 8 月 8 日全国公映': 'posters/05_ni_guang.jpg',
    '《无声告白》爱奇艺迷雾剧场开播': 'posters/06_wu_sheng.jpg',
    '《慢游中国》第二季定档 8 月 2 日开播': 'posters/07_man_you.jpg',
    '《星海战记》提档至 7 月 28 日首播': 'posters/08_xing_hai.jpg',
    '《夏日晚风》点映开启': 'posters/09_xia_ri.jpg',
    '《破晓行动》定档 8 月 15 日优酷独播': 'posters/10_po_xiao.jpg',
    '《脑力竞技场》新一季开播': 'posters/11_nao_li.jpg',
    '《猫町奇谭》全集上线': 'posters/12_mao_ding.jpg',
    '《山河笔记》自然纪录片上线': 'posters/13_shan_he.jpg',
    '《丝路遗珍》定档 8 月 10 日开播': 'posters/14_si_lu.jpg'
  };

  // ============ 渲染 ============
  const timelineEl = document.getElementById('timeline');
  let currentType = 'all';
  let currentRange = 'all';
  let keyword = '';

  // 今天基准（用于本周/本月/即将上线判定）
  const TODAY = new Date('2026-07-23');

  function inRange(dateStr, range) {
    const d = new Date(dateStr);
    const diffDays = Math.round((d - TODAY) / 86400000);
    if (range === 'week')   return diffDays >= -7 && diffDays <= 0;   // 本周：过去7天内
    if (range === 'month')  return diffDays >= -30 && diffDays <= 0;  // 本月：过去30天内
    if (range === 'upcoming') return diffDays > 0;                    // 即将上线：未来
    return true;  // 全部
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const month = (d.getMonth() + 1) + '月';
    const day = d.getDate();
    return { month, day: String(day).padStart(2, '0') };
  }

  function render() {
    const filtered = NEWS.filter(n => {
      const typeOk = currentType === 'all' || n.type === currentType;
      const rangeOk = inRange(n.date, currentRange);
      const kwOk = !keyword || n.title.includes(keyword) || n.summary.includes(keyword);
      return typeOk && rangeOk && kwOk;
    });

    if (filtered.length === 0) {
      timelineEl.innerHTML = '<div class="empty-tip">当前筛选条件下暂无资讯</div>';
      return;
    }

    // 按日期倒序
    filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

    // 同日资讯合并时间节点：仅每组首条显示日期与节点
    let prevDate = null;
    timelineEl.innerHTML = filtered.map((n, idx) => {
      const t = TYPE_MAP[n.type];
      const e = EVENT_MAP[n.event];
      const dt = formatDate(n.date);
      const sameDay = n.date === prevDate;
      prevDate = n.date;
      const nodeCls = n.status === 'pending' ? 'tl-node pending' : 'tl-node';
      const evText = n.event === 'online' ? '上线' : (n.event === 'advance' ? '提档' : '定档');
      const fullDate = n.date.replace(/-/g, '/') + ' ' + evText;
      const poster = POSTER_MAP[n.title];
      return `
        <div class="tl-item" data-idx="${idx}">
          ${sameDay ? '' : `<div class="tl-date">
            <div class="day">${dt.day}</div>
            <div class="month">${dt.month}</div>
          </div>
          <div class="${nodeCls}"></div>`}
          <div class="card">
            <div class="poster"><img src="${poster}" alt="${n.title}" loading="lazy"></div>
            <div class="card-body">
              <h3 class="card-title">${n.title}</h3>
              <div class="card-head">
                <span class="tag ${t.tag}">${t.name}</span>
                <span class="event-badge ${e.cls}">${e.name}</span>
              </div>
              <p class="card-summary">${n.summary}</p>
              <div class="card-foot">
                <span class="source">来源：<a href="${n.sourceLink}" target="_blank" rel="noopener">${n.source}</a></span>
                <span class="card-date">${fullDate}</span>
                <button class="detail-btn" onclick="toggleDetail(this)">查看详情 ▾</button>
              </div>
              <div class="detail">
                <p>${n.detail.intro}</p>
                <div class="meta-line"><strong>主创：</strong>${n.detail.cast}</div>
                <div class="meta-line"><strong>播出：</strong>${n.detail.platform}</div>
                <div class="meta-line"><strong>规格：</strong>${n.detail.ep}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // 触发滚动淡入观察
    observeItems();
  }

  // ============ 详情展开/收起 ============
  window.toggleDetail = function(btn) {
    const detail = btn.parentElement.nextElementSibling;
    const isOpen = detail.classList.toggle('open');
    btn.textContent = isOpen ? '收起 ▴' : '查看详情 ▾';
  };

  // ============ 筛选交互 ============
  document.querySelectorAll('.chip[data-type]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-type]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentType = chip.dataset.type;
      render();
    });
  });
  document.querySelectorAll('.chip[data-range]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-range]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentRange = chip.dataset.range;
      render();
    });
  });

  // ============ 搜索 ============
  document.getElementById('searchInput').addEventListener('input', (e) => {
    keyword = e.target.value.trim();
    render();
  });

  // ============ 滚动淡入 ============
  let observer;
  function observeItems() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.tl-item').forEach(item => observer.observe(item));
  }

  // ============ 回到顶部 ============
  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) backTop.classList.add('show');
    else backTop.classList.remove('show');
  });
  backTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ============ 初始渲染 ============
  render();
</script>
