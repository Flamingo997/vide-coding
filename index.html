<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影新鲜 · 影视上新定档时间线</title>
<!-- v2.0 - Cloudflare Pages deployment -->
<link rel="stylesheet" href="styles.css?v=15">
</head>
<body>

<!-- 顶部通栏导航（吸顶） -->
<header class="topnav">
  <div class="brand" data-view="home">
    <svg class="logo" width="52" height="52" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFB347"/>
          <stop offset="40%" stop-color="#FF8C00"/>
          <stop offset="100%" stop-color="#FF5722"/>
        </linearGradient>
        <linearGradient id="orangeHighlight" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- 橙子主体 -->
      <circle cx="32" cy="36" r="22" fill="url(#orangeGrad)"/>
      <!-- 橙子高光 -->
      <ellipse cx="25" cy="28" rx="8" ry="6" fill="url(#orangeHighlight)"/>
      <!-- 橙子纹理点 -->
      <circle cx="22" cy="32" r="1" fill="#fff" opacity="0.3"/>
      <circle cx="40" cy="30" r="1.2" fill="#fff" opacity="0.3"/>
      <circle cx="28" cy="42" r="0.8" fill="#fff" opacity="0.3"/>
      <circle cx="38" cy="44" r="1" fill="#fff" opacity="0.25"/>
      <circle cx="44" cy="38" r="0.9" fill="#fff" opacity="0.25"/>
      <!-- 橙子叶子 -->
      <path d="M32 14 Q28 8 34 6 Q38 10 32 14" fill="#4CAF50"/>
      <path d="M32 14 Q36 8 30 6 Q26 10 32 14" fill="#66BB6A"/>
      <!-- 播放按钮 蓝色圆形 -->
      <circle cx="46" cy="20" r="11" fill="#2F86FF"/>
      <polygon points="43,14 43,26 53,20" fill="#fff"/>
      <circle cx="46" cy="20" r="13" fill="none" stroke="#2F86FF" stroke-width="1.5" opacity="0.25"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">影新鲜</span>
      <span class="brand-slogan">每日上新 · 定档速览</span>
    </div>
  </div>
  <nav class="nav" id="nav">
    <a class="nav-item active" data-view="home">首页</a>
    <a class="nav-item" data-view="timeline" data-type="movie"><span class="nav-dot" style="background:#FF7D00"></span>电影</a>
    <a class="nav-item" data-view="timeline" data-type="drama"><span class="nav-dot" style="background:#2F86FF"></span>电视剧</a>
    <a class="nav-item" data-view="timeline" data-type="show"><span class="nav-dot" style="background:#F54A8B"></span>综艺</a>
    <a class="nav-item" data-view="timeline" data-type="anime"><span class="nav-dot" style="background:#FFB800"></span>动漫</a>
    <a class="nav-item optional" data-view="timeline" data-type="doc"><span class="nav-dot" style="background:#2FA787"></span>纪录片</a>
    <a class="nav-item optional" data-view="timeline" data-type="duan"><span class="nav-dot" style="background:#9966FF"></span>短剧</a>
    <span class="nav-more" id="navMore">更多 ▾
      <span class="more-menu">
        <a data-view="timeline" data-type="doc"><span class="nav-dot" style="background:#2FA787"></span>纪录片</a>
        <a data-view="timeline" data-type="duan"><span class="nav-dot" style="background:#9966FF"></span>短剧</a>
      </span>
    </span>
  </nav>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索作品 / 关键词">
  </div>
</header>

<!-- 首页视图 -->
<main id="homeView">
  <div class="home-layout">
    <div class="home-main">

      <!-- 轮播 Banner -->
      <section class="banner" id="banner">
        <div class="slides" id="slides"></div>
        <div class="banner-controls">
          <div class="dots" id="dots"></div>
          <div class="banner-btns">
            <button class="banner-btn prev" id="prevBtn" aria-label="上一张">‹</button>
            <button class="banner-btn next" id="nextBtn" aria-label="下一张">›</button>
          </div>
        </div>
      </section>

      <!-- 分品类上新卡片组 -->
      <div id="catGroups"></div>

    </div>

    <!-- 右侧边栏 -->
    <aside class="home-side">
      <div class="side-card box-office-card" id="boxOfficeCard">
        <h3 class="side-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px;margin-right:6px">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3Z" stroke="#FF7D00" stroke-width="2"/>
            <path d="M9 17V7L17 12L9 17Z" fill="#FF7D00"/>
          </svg>
          今日票房
        </h3>
        <div id="boxOffice"></div>
        <a class="side-link" id="boxOfficeMore">查看更多电影资讯 →</a>
      </div>

      <div class="side-card market-card" id="marketCard" title="点击查看猫眼专业版票房大盘">
        <div class="market-chart">
          <svg width="60" height="40" viewBox="0 0 60 40" style="opacity:0.5">
            <polyline points="0,35 10,28 20,30 30,20 40,22 50,12 60,8" stroke="#FF7D00" stroke-width="2" fill="none" stroke-linecap="round"/>
            <polyline points="0,35 10,28 20,30 30,20 40,22 50,12 60,8 60,40 0,40" fill="url(#marketGrad)"/>
            <defs><linearGradient id="marketGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF7D00" stop-opacity="0.3"/><stop offset="100%" stop-color="#FF7D00" stop-opacity="0"/></linearGradient></defs>
          </svg>
        </div>
        <div class="market-label-wrap">
          <svg class="market-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="12" width="4" height="8" rx="1" fill="#FFB347"/>
            <rect x="10" y="8" width="4" height="12" rx="1" fill="#FF8C00"/>
            <rect x="17" y="4" width="4" height="16" rx="1" fill="#FF5722"/>
          </svg>
          <span class="market-label">今日大盘</span>
        </div>
        <div class="market-num" id="marketNum">--</div>
        <div class="market-meta" id="marketMeta">数据更新中…</div>
        <div class="market-go">猫眼专业版 ↗</div>
      </div>

      <div class="side-card news-side-card">
        <h3 class="side-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px;margin-right:6px">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3Z" stroke="#FF7D00" stroke-width="2"/>
            <path d="M7 7H17V9H7V7ZM7 11H17V13H7V11ZM7 15H13V17H7V15Z" fill="#FF7D00"/>
          </svg>
          影视资讯
        </h3>
        <div id="flashList"></div>
      </div>
      <div class="side-spacer" id="sideSpacer"></div>
    </aside>
  </div>
</main>

<!-- 分类/全量时间线视图 -->
<main id="tlView" hidden>
  <div class="tl-page" id="tlPage">
    <h1 class="tl-title" id="tlTitle">全量时间线</h1>
    <div class="range-row" id="rangeRow">
      <span class="range-label">时间</span>
      <button class="pill active" data-range="all">全部</button>
      <button class="pill" data-range="week">本周</button>
      <button class="pill" data-range="month">本月</button>
      <button class="pill" data-range="upcoming">即将上线</button>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</main>

<footer class="footer">
  <p>本页面影视资讯来自 TMDB（themoviedb.org），API 异常时显示本地模拟数据，仅供演示，不作为实际观影决策依据。</p>
  <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  <p class="version">Version 0.5</p>
</footer>

<button class="back-top" id="backTop" aria-label="回到顶部">↑</button>

<script>
  let NEWS, NEWS_FLASH, POSTER_MAP, WIDE_POSTER_MAP, TYPE_MAP, EVENT_NAME, TYPE_BG, TIMES, WEEKDAYS;

  let currentView = 'home';
  let currentType = 'all';
  let currentRange = 'all';
  let keyword = '';

  const TODAY = new Date();

  function inRange(dateStr, range) {
    const d = new Date(dateStr);
    const diffDays = Math.round((d - TODAY) / 86400000);
    if (range === 'week')     return diffDays >= -7 && diffDays <= 0;
    if (range === 'month')    return diffDays >= -30 && diffDays <= 0;
    if (range === 'upcoming') return diffDays > 0;
    return true;
  }

  function dayLabel(dateStr) {
    const d = new Date(dateStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
  }

  function pseudoBox(title, seed) {
    let h = seed * 7919;
    for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) % 100000;
    return 300 + (h % 4700);
  }

  function goView(view, type) {
    currentView = view;
    currentType = type || 'all';
    document.getElementById('homeView').hidden = view !== 'home';
    document.getElementById('tlView').hidden = view !== 'timeline';

    // 视图切换过渡动画（淡入 + 上移）
    const showEl = view === 'home' ? document.getElementById('homeView') : document.getElementById('tlView');
    showEl.classList.remove('view-enter');
    void showEl.offsetWidth; // 强制重排以重启动画
    showEl.classList.add('view-enter');

    const themeColor = view === 'timeline' && currentType !== 'all'
      ? TYPE_MAP[currentType].color : '#2F86FF';
    document.documentElement.style.setProperty('--theme', themeColor);
    document.body.style.background = view === 'timeline'
      ? (TYPE_BG[currentType] || TYPE_BG.all) : TYPE_BG.all;

    document.querySelectorAll('.nav-item, .more-menu a').forEach(a => {
      a.classList.toggle('active', a.dataset.view === view && (a.dataset.type || '') === (view === 'home' ? '' : currentType));
    });

    if (view === 'timeline') {
      document.getElementById('tlTitle').textContent =
        currentType === 'all' ? '全量时间线' : TYPE_MAP[currentType].name;
      renderTimeline(document.getElementById('timeline'), { type: currentType, range: currentRange, keyword });
    }
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  document.querySelectorAll('.nav-item, .more-menu a, .brand').forEach(el => {
    el.addEventListener('click', () => goView(el.dataset.view, el.dataset.type));
  });

  document.querySelectorAll('#rangeRow .pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('#rangeRow .pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      currentRange = p.dataset.range;
      renderTimeline(document.getElementById('timeline'), { type: currentType, range: currentRange, keyword });
    });
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    keyword = e.target.value.trim();
    if (keyword && currentView === 'home') { goView('timeline', 'all'); return; }
    if (currentView === 'timeline') {
      renderTimeline(document.getElementById('timeline'), { type: currentType, range: currentRange, keyword });
    }
  });

  // ============ 轮播 Banner ============
  function initBanner() {
    const BANNER_ITEMS = NEWS
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .slice(0, 6)
      .map(n => {
        const poster = n.poster || POSTER_MAP[n.title];
        const wide = n.widePoster || WIDE_POSTER_MAP[n.title] || null;
        // 去掉定档日期，只保留影片名
        const cleanTitle = n.title
          .replace(/定档\d{4}年\d+月\d+日/, '')
          .replace(/定档\d+月\d+日/, '')
          .replace(/\s+/g, ' ')
          .trim();
        return {
          title: cleanTitle,
          poster,
          wide,
          type: n.type,
          summary: n.summary,
          color: TYPE_MAP[n.type].color
        };
      });

    if (BANNER_ITEMS.length === 0) return;

    const slidesEl = document.getElementById('slides');
    const dotsEl = document.getElementById('dots');
    let slideIdx = 0;
    let slideTimer = null;

    slidesEl.innerHTML = BANNER_ITEMS.map((n, i) => {
      if (n.wide) {
        return `
          <div class="slide${i === 0 ? ' on' : ''}" style="background: linear-gradient(135deg, ${n.color}22, #1A1F2E);">
            <img src="${n.wide}" class="slide-bg" alt="${n.title}">
            <div class="slide-overlay"></div>
            <div class="slide-info">
              <span class="slide-tag" style="background:${n.color}">${TYPE_MAP[n.type].name}</span>
              <h2>${n.title}</h2>
              <p>${n.summary}</p>
            </div>
          </div>`;
      } else {
        return `
          <div class="slide${i === 0 ? ' on' : ''}" style="background: linear-gradient(135deg, ${n.color}dd 0%, ${n.color}88 40%, #1A1F2E 100%);">
            <div class="slide-with-poster">
              <div class="slide-poster-wrap">
                <img src="${n.poster}" class="slide-poster" alt="${n.title}">
                <div class="slide-poster-glow" style="box-shadow: 0 0 60px ${n.color}88;"></div>
              </div>
              <div class="slide-text-only">
                <span class="slide-tag" style="background:${n.color}">${TYPE_MAP[n.type].name}</span>
                <h2>${n.title}</h2>
                <p>${n.summary}</p>
              </div>
            </div>
          </div>`;
      }
    }).join('');

    function renderTitle() {
      // 标题直接由 .slide h2 渲染，保留此函数为占位
    }
    renderTitle();

    dotsEl.innerHTML = BANNER_ITEMS.map((_, i) => `<span class="${i === 0 ? 'on' : ''}" data-i="${i}"></span>`).join('');

    function goSlide(i) {
      slideIdx = (i + BANNER_ITEMS.length) % BANNER_ITEMS.length;
      slidesEl.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
      dotsEl.querySelectorAll('span').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
      renderTitle();
    }
    function startAuto() { stopAuto(); slideTimer = setInterval(() => goSlide(slideIdx + 1), 5000); }
    function stopAuto() { if (slideTimer) clearInterval(slideTimer); }

    document.getElementById('prevBtn').addEventListener('click', () => goSlide(slideIdx - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goSlide(slideIdx + 1));
    dotsEl.querySelectorAll('span').forEach(s => s.addEventListener('click', () => goSlide(Number(s.dataset.i))));
    const bannerEl = document.getElementById('banner');
    bannerEl.addEventListener('mouseenter', stopAuto);
    bannerEl.addEventListener('mouseleave', startAuto);
    startAuto();
  }

  function renderTimeline(container, opt) {
    const { type = 'all', range = 'all', keyword: kw = '', limit = 0 } = opt;
    let filtered = NEWS.filter(n => {
      if (!n.date || n.date === '0000-00-00') return false;
      const typeOk = type === 'all' || n.type === type;
      const rangeOk = inRange(n.date, range);
      const kwOk = !kw || n.title.includes(kw) || n.summary.includes(kw);
      return typeOk && rangeOk && kwOk;
    }).sort((a, b) => {
      const da = new Date(a.date), db = new Date(b.date);
      if (isNaN(db) && isNaN(da)) return 0;
      if (isNaN(db)) return -1;
      if (isNaN(da)) return 1;
      return db - da;
    });

    if (limit > 0) filtered = filtered.slice(0, limit);

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-tip">当前筛选条件下暂无资讯</div>';
      return;
    }

    const groups = [];
    filtered.forEach(n => {
      const last = groups[groups.length - 1];
      if (last && last.date === n.date) last.items.push(n);
      else groups.push({ date: n.date, items: [n] });
    });

    container.innerHTML = groups.map(g => `
      <section class="day-group">
        <h2 class="day-head">${dayLabel(g.date)}</h2>
        ${g.items.map(n => {
          const t = TYPE_MAP[n.type];
          if (!t) return '';
          const time = TIMES[NEWS.indexOf(n) % TIMES.length];
          const nodeCls = 'tl-node';
          const nid = n.id || (n.title + '|' + n.date);
          return `
            <div class="tl-item" style="--tc:${t.color}" data-id="${nid}">
              <div class="${nodeCls}"></div>
              <article class="card" onclick="toggleCard(this)">
                <div class="poster"><img src="${n.poster || POSTER_MAP[n.title]}" alt="${n.title}" loading="lazy" onerror="this.style.visibility='hidden'"></div>
                <div class="card-main">
                  <div class="card-top">
                    <span class="card-time">${time} · ${EVENT_NAME[n.event]}</span>
                    <span class="tag-solid">${t.name}</span>
                  </div>
                  <h3 class="card-title">${n.title}<span class="detail-hint">点击卡片展开详情</span></h3>
                  <p class="card-summary">${n.summary || n.detail?.intro || '暂无简介'}</p>
                  <div class="card-foot">
                    <span class="source">来源：${n.source}</span>
                    <a class="src-btn" href="${n.sourceLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看来源 -></a>
                  </div>
                  <div class="detail">
                    <p>${n.detail?.intro || n.summary || '暂无简介'}</p>
                    <div class="meta-line"><strong>主创：</strong>${n.detail.cast}</div>
                    <div class="meta-line"><strong>播出：</strong>${n.detail.platform}</div>
                    <div class="meta-line"><strong>规格：</strong>${n.detail.ep}</div>
                  </div>
                </div>
              </article>
            </div>`;
        }).join('')}
      </section>
    `).join('');

    // 来自首页海报点击的待定位 ID
    const pending = sessionStorage.getItem('pendingScrollId');
    if (pending) {
      sessionStorage.removeItem('pendingScrollId');
      const target = container.querySelector(`.tl-item[data-id="${pending}"]`);
      if (target) {
        setTimeout(() => {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.style.transition = 'background 0.6s';
          target.style.background = 'rgba(255, 179, 71, 0.18)';
          setTimeout(() => { target.style.background = ''; }, 1600);
        }, 60);
      }
    }
  }

  window.toggleCard = function (card) {
    card.querySelector('.detail').classList.toggle('open');
  };

  // ============ 首页：分品类上新卡片组（网格布局，无滚动条） ============
  // 检测是否包含中文
  function hasChinese(text) {
    return /[\u4e00-\u9fff]/.test(text || '');
  }
  // 截断为一句简介：中英文通用，按标点截断第一句
  function oneLineSummary(text) {
    if (!text || text.length < 2) return '暂无简介';
    let s = text.replace(/^《.+?》/, '').trim();
    // 按中英文句号/问号/感叹号截断为第一句
    const m = s.match(/^(.+?)[。.!?！？]/);
    if (m && m[1].length > 3) s = m[1].trim();
    // 首页一行展示，严格限制长度
    if (s.length > 20) return s.slice(0, 20) + '…';
    return s;
  }

  function renderCatGroups() {
    const order = ['movie', 'drama', 'show', 'anime', 'duan', 'doc'];
    document.getElementById('catGroups').innerHTML = order.map(type => {
      const t = TYPE_MAP[type];
      // 过滤无海报：短剧允许无海报，其他品类必须有 poster
      const items = NEWS.filter(n => {
        if (n.type !== type) return false;
        if (type === 'duan') return true;
        return !!(n.poster || POSTER_MAP[n.title]);
      })
        .sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 6);
      if (!items.length) return '';
      return `
        <section class="block cat-group">
          <div class="cat-head">
            <h2 class="block-title" style="color:${t.color}">${t.name}</h2>
            <a class="more-link" data-type="${type}">查看更多 →</a>
          </div>
          <div class="cat-grid">
            ${items.map(n => {
              const summary = n.summary || n.detail?.intro || '';
              const cardDesc = oneLineSummary(summary);
              return `
              <div class="cat-card" data-type="${type}" data-id="${n.id || (n.title + '|' + n.date)}">
                <div class="cat-poster-wrap">
                  <img src="${n.poster || POSTER_MAP[n.title]}" alt="${n.title}" loading="lazy" onerror="this.parentElement.parentElement.remove()">
                  <span class="cat-badge" style="background:${t.color}">${EVENT_NAME[n.event]}</span>
                </div>
                <div class="cat-card-info">
                  <div class="cat-card-title">${n.title}</div>
                  <div class="cat-card-desc">${cardDesc}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </section>`;
    }).join('');
    document.querySelectorAll('.more-link').forEach(el => {
      el.addEventListener('click', () => goView('timeline', el.dataset.type));
    });
    // 海报点击：跳转到该分类时间线，并自动滚动到对应条目
    document.querySelectorAll('.cat-card').forEach(el => {
      el.addEventListener('click', () => {
        const type = el.dataset.type;
        const id = el.dataset.id;
        sessionStorage.setItem('pendingScrollId', id);
        goView('timeline', type);
      });
    });
  }

  // ============ 首页边栏：票房榜 + 大盘 + 资讯（优化版） ============
  function renderSidebar() {
    const movies = NEWS.filter(n => n.type === 'movie' && n.event === 'online')
      .sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
    let sum = 0;
    document.getElementById('boxOffice').innerHTML = movies.map((n, i) => {
      const box = pseudoBox(n.title, i + 1);
      sum += box;
      const name = n.title.replace(/《(.+?)》.*/, '$1');
      const poster = n.poster || POSTER_MAP[n.title];
      if (i === 0) {
        return `
          <div class="bo-item bo-top">
            <div class="bo-top-poster">
              <img src="${poster}" alt="${name}">
              <span class="bo-rank top3 big">1</span>
            </div>
            <div class="bo-top-info">
              <div class="bo-top-name">${name}</div>
              <div class="bo-top-box">${box}万 <span class="bo-trend">↑ 热映中</span></div>
            </div>
          </div>`;
      }
      return `
        <div class="bo-item">
          <span class="bo-rank${i < 3 ? ' top3' : ''}">${i + 1}</span>
          <span class="bo-name">${name}</span>
          <span class="bo-num">${box}万</span>
        </div>`;
    }).join('') || '<div class="empty-tip">暂无数据</div>';

    document.getElementById('marketNum').textContent = (sum * 2.6 / 10000).toFixed(2) + ' 亿';
    const now = new Date();
    document.getElementById('marketMeta').textContent =
      `更新于 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} · 数据来源：灯塔/猫眼`;

    document.getElementById('flashList').innerHTML = NEWS_FLASH.map((f, i) => `
      <div class="flash-item">
        <span class="flash-dot"></span>
        <span class="flash-content">
          <span class="flash-title">${f.title}</span>
          <span class="flash-time">${f.time}</span>
        </span>
      </div>`).join('');

    adjustSideSpacer();
  }

  function adjustSideSpacer() {
    const homeMain = document.querySelector('.home-main');
    const homeSide = document.querySelector('.home-side');
    const spacer = document.getElementById('sideSpacer');
    if (!homeMain || !homeSide || !spacer) return;
    const mainH = homeMain.getBoundingClientRect().height;
    const sideH = homeSide.getBoundingClientRect().height - spacer.getBoundingClientRect().height;
    const gap = parseFloat(getComputedStyle(document.querySelector('.home-layout')).gap) || 28;
    // 侧栏总高度补齐到接近左侧主内容高度，使其能跟随滚动直到底部
    const needed = Math.max(0, mainH - sideH - gap);
    spacer.style.height = needed + 'px';
  }

  window.addEventListener('load', adjustSideSpacer);
  window.addEventListener('resize', adjustSideSpacer);

  document.getElementById('boxOfficeMore').addEventListener('click', () => goView('timeline', 'movie'));
  document.getElementById('marketCard').addEventListener('click', () => {
    window.open('https://piaofang.maoyan.com/dashboard/movie', '_blank');
  });

  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    backTop.classList.toggle('show', window.scrollY > 400);
  });
  backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      ({ NEWS, NEWS_FLASH, POSTER_MAP, WIDE_POSTER_MAP, TYPE_MAP, EVENT_NAME, TYPE_BG, TIMES, WEEKDAYS } = data);
      // 合并 TMDB（电影/剧/综艺/动漫/纪录片）与 kuleu（短剧）两类实时数据；
      // data.json 内的静态条目仅作首页兜底展示。
      const tmbdQ = fetch('/api/tmdb?v=10').then(r => r.json()).catch(() => null);
      const duanQ = fetch('/api/shortdrama?limit=12').then(r => r.json()).catch(() => null);
      return Promise.all([tmbdQ, duanQ]).then(([tmbd, duan]) => {
        const merged = (data.NEWS || []).slice();
        if (tmbd && tmbd.code === 0 && tmbd.data && tmbd.data.length) {
          merged.push(...tmbd.data);
        }
        if (duan && duan.code === 0 && duan.data && duan.data.length) {
          merged.push(...duan.data);
        }
        NEWS = merged;
      });
    })
    .then(() => {
      initBanner();
      renderCatGroups();
      renderSidebar();
    });
</script>
</body>
</html>
