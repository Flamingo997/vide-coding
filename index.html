<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视上新快讯 · 每日上新定档速览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #F5F7FA;            /* 页面底色：浅灰蓝 */
    --sidebar-bg: #F0F3F8;    /* 侧边栏底色 */
    --card: #FFFFFF;
    --primary: #2F86FF;
    --text-1: #1A1F2E;        /* 一级文字：深炭黑 */
    --text-2: #4E5969;        /* 二级文字：中灰 */
    --text-3: #86909C;        /* 三级文字：浅灰 */
    --line: #E5E7EB;
    /* 品类色 */
    --c-movie: #FF7D29;
    --c-drama: #2F86FF;
    --c-show:  #EC4899;
    --c-anime: #22C55E;
    --c-doc:   #8B5CF6;
    --card-shadow: 0 2px 10px rgba(26,31,46,0.05);
    --card-shadow-hover: 0 8px 24px rgba(26,31,46,0.10);
  }
  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }

  /* ===== 整体布局：左固定侧边栏 + 右滚动内容区 ===== */
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 224px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--line);
    padding: 28px 16px 20px;
    display: flex;
    flex-direction: column;
    z-index: 50;
  }
  .brand h1 {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-1);
    letter-spacing: 1px;
  }
  .brand p {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 4px;
  }
  .side-search { margin: 18px 0 20px; position: relative; }
  .side-search input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    outline: none;
    font-family: inherit;
    color: var(--text-1);
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .side-search input::placeholder { color: var(--text-3); }
  .side-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,134,255,0.12); }
  .side-search::before {
    content: '🔍';
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px; opacity: 0.45;
    pointer-events: none;
  }
  .side-label {
    font-size: 12px;
    color: var(--text-3);
    margin: 0 8px 8px;
  }
  .side-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 4px;
    font-size: 14px;
    color: var(--text-2);
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: background 0.18s, box-shadow 0.18s, color 0.18s;
  }
  .side-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .side-item:hover { background: #fff; box-shadow: 0 2px 8px rgba(26,31,46,0.06); }
  .side-item.active {
    background: rgba(47,134,255,0.12);
    color: var(--primary);
    font-weight: 600;
  }
  .side-foot {
    margin-top: auto;
    font-size: 11px;
    color: var(--text-3);
    padding: 0 8px;
  }
  .side-foot .demo-tag {
    display: inline-block;
    color: var(--c-movie);
    background: #FFF0E6;
    padding: 2px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
  }

  .content {
    margin-left: 224px;
    padding: 24px 32px 60px;
    max-width: 1080px;
  }

  /* ===== 顶部轮播 Banner ===== */
  .banner {
    position: relative;
    height: 300px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    margin-bottom: 24px;
  }
  .slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 30%;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .slide.on { opacity: 1; }
  /* 底部渐变蒙层：透明 -> 半透深灰，保证白字可读 */
  .slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(26,31,46,0) 30%, rgba(26,31,46,0.55) 78%, rgba(26,31,46,0.68) 100%);
  }
  .slide-info {
    position: absolute;
    left: 28px; right: 80px; bottom: 24px;
    z-index: 2;
    color: #fff;
  }
  .slide-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    padding: 3px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .slide-info h2 {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .slide-info p {
    font-size: 13px;
    color: rgba(255,255,255,0.88);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .banner-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.35);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.18s;
  }
  .banner-arrow:hover { background: rgba(255,255,255,0.55); }
  .banner-arrow.prev { left: 14px; }
  .banner-arrow.next { right: 14px; }
  .banner-dots {
    position: absolute;
    right: 24px; bottom: 20px;
    z-index: 3;
    display: flex;
    gap: 8px;
  }
  .banner-dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .banner-dots span.on { background: #fff; transform: scale(1.25); }

  /* ===== 时间范围筛选胶囊 ===== */
  .range-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .range-label { font-size: 13px; color: var(--text-3); margin-right: 4px; }
  .chip {
    padding: 6px 16px;
    font-size: 13px;
    border-radius: 999px;
    border: none;
    background: #fff;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
    box-shadow: var(--card-shadow);
  }
  .chip:hover { color: var(--primary); }
  .chip.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(47,134,255,0.28);
  }

  /* ===== 时间线 ===== */
  .timeline { position: relative; }
  /* 贯穿竖线：极浅灰，弱化存在感 */
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 56px;
    bottom: 40px;
    width: 0;
    border-left: 2px solid var(--line);
  }
  .day-group { margin-bottom: 26px; }
  .day-head {
    font-size: 16px;
    font-weight: 800;
    color: var(--text-1);
    margin-bottom: 14px;
    padding-left: 28px;
    position: relative;
  }
  .tl-item {
    position: relative;
    padding-left: 28px;
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .tl-item.visible { opacity: 1; transform: translateY(0); }
  /* 时间节点：品类色实心圆点；待上线为空心 */
  .tl-node {
    position: absolute;
    left: 0;
    top: 22px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--tc, var(--primary));
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 2px var(--tc, var(--primary));
    z-index: 2;
  }
  .tl-node.pending {
    background: #fff;
    box-shadow: 0 0 0 2px var(--tc, var(--primary));
  }

  /* ===== 资讯卡片：白卡轻影 + 左侧品类色边 ===== */
  .card {
    position: relative;
    background: var(--card);
    border-radius: 8px;
    padding: 16px 18px 14px 20px;
    box-shadow: var(--card-shadow);
    cursor: pointer;
    transition: box-shadow 0.22s, transform 0.22s;
  }
  /* 左侧 2px 品类色竖边 */
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 2px;
    border-radius: 2px;
    background: var(--tc, var(--primary));
    transition: width 0.22s;
  }
  .card:hover {
    box-shadow: var(--card-shadow-hover);
    transform: translateY(-2px);
  }
  .card:hover::before { width: 4px; }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  /* 时分标注：中灰弱化 */
  .card-time {
    font-size: 12px;
    color: var(--text-2);
  }
  /* 类型标签：低饱和彩色填充 + 白字胶囊 */
  .tag-solid {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    padding: 2px 12px;
    border-radius: 999px;
    background: var(--tc, var(--primary));
    flex-shrink: 0;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-1);
    line-height: 1.5;
    margin-bottom: 6px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .card-summary {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.7;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .source {
    font-size: 12px;
    color: var(--text-3);
  }
  .src-btn {
    font-size: 12px;
    color: var(--text-3);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 4px 12px;
    border-radius: 999px;
    transition: color 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .src-btn:hover { color: var(--primary); border-color: var(--primary); }
  /* 详情展开区 */
  .detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease;
    border-top: 1px solid transparent;
  }
  .detail.open {
    max-height: 600px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .detail p {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.8;
    margin-bottom: 10px;
  }
  .detail .meta-line {
    font-size: 12px;
    color: var(--text-3);
  }
  .detail .meta-line strong { color: var(--text-2); font-weight: 600; }
  .detail-hint {
    font-size: 11px;
    color: var(--text-3);
    margin-left: 8px;
  }

  .empty-tip {
    text-align: center;
    color: var(--text-3);
    padding: 60px 0;
    font-size: 14px;
  }

  /* ===== 底部说明 ===== */
  .footer {
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .footer p {
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.8;
  }
  .footer .version {
    margin-top: 8px;
    font-weight: 600;
    color: var(--text-2);
  }

  /* ===== 回到顶部：白底 + 主色图标 ===== */
  .back-top {
    position: fixed;
    right: 32px;
    bottom: 32px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--line);
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(26,31,46,0.12);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 90;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-top.show { opacity: 1; pointer-events: auto; }
  .back-top:hover { transform: translateY(-3px); }
</style>
</head>

    </section>

    <!-- 时间线主体 -->
    <main class="timeline" id="timeline"></main>

    <!-- 底部说明 -->
    <footer class="footer">

      <p class="version">Version 0.3</p>
    </footer>
  </div>

  <!-- 回到顶部 -->
  <button class="back-top" id="backTop" aria-label="回到顶部">↑</button>

  // ============ 海报封面（本地文件，按标题映射） ============
  const POSTER_MAP = {
    '《长安霓裳录》全网首播': 'posters/01_chang_an.jpg',
    '《深海回响》全国院线上映': 'posters/02_shen_hai.jpg',
    '《声浪2026》第三季回归开播': 'posters/03_sheng_lang.jpg',
    '《雾山行》国产动画第二季上线': 'posters/04_wu_shan.jpg',
    '《逆光行者》定档 8 月 8 日全国公映': 'posters/05_ni_guang.jpg',
    '《无声告白》爱奇艺迷雾剧场开播': 'posters/06_wu_sheng.jpg',
    '《慢游中国》第二季定档 8 月 2 日开播': 'posters/07_man_you.jpg',
    '《星海战记》提档至 7 月 28 日首播': 'posters/08_xing_hai.jpg',
    '《夏日晚风》点映开启': 'posters/09_xia_ri.jpg',
    '《破晓行动》定档 8 月 15 日优酷独播': 'posters/10_po_xiao.jpg',
    '《脑力竞技场》新一季开播': 'posters/11_nao_li.jpg',
    '《猫町奇谭》全集上线': 'posters/12_mao_ding.jpg',
    '《山河笔记》自然纪录片上线': 'posters/13_shan_he.jpg',
    '《丝路遗珍》定档 8 月 10 日开播': 'posters/14_si_lu.jpg'
  };

  // ============ 类型/事件映射（含品类色） ============
  const TYPE_MAP = {
    movie: { name: '院线电影', color: '#FF7D29' },
    drama: { name: '电视剧',   color: '#2F86FF' },
    show:  { name: '综艺',    color: '#EC4899' },
    anime: { name: '动漫',    color: '#22C55E' },
    doc:   { name: '纪录片',  color: '#8B5CF6' }
  };
  const EVENT_NAME = { online: '上线', schedule: '定档', advance: '提档' };

  // 模拟发布时分（按数据顺序）
  const TIMES = ['09:30','10:00','11:20','14:00','15:30','16:40','18:00','19:20','20:00','21:00','08:40','13:10','10:40','17:20'];
  const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

  // ============ 状态 ============
  const timelineEl = document.getElementById('timeline');
  let currentType = 'all';
  let currentRange = 'all';
  let keyword = '';

  // 今天基准（用于本周/本月/即将上线判定）
  const TODAY = new Date('2026-07-23');

  function inRange(dateStr, range) {
    const d = new Date(dateStr);
    const diffDays = Math.round((d - TODAY) / 86400000);
    if (range === 'week')     return diffDays >= -7 && diffDays <= 0;
    if (range === 'month')    return diffDays >= -30 && diffDays <= 0;
    if (range === 'upcoming') return diffDays > 0;
    return true;
  }

  function dayLabel(dateStr) {
    const d = new Date(dateStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
  }

  // ============ 渲染时间线（按日期分组） ============
  function render() {
    const filtered = NEWS.filter(n => {
      const typeOk = currentType === 'all' || n.type === currentType;
      const rangeOk = inRange(n.date, currentRange);
      const kwOk = !keyword || n.title.includes(keyword) || n.summary.includes(keyword);
      return typeOk && rangeOk && kwOk;
    });

    if (filtered.length === 0) {
      timelineEl.innerHTML = '<div class="empty-tip">当前筛选条件下暂无资讯</div>';
      return;
    }

    // 按日期倒序
    filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

    // 按日期分组：同一天资讯归为一组
    const groups = [];
    filtered.forEach(n => {
      const last = groups[groups.length - 1];
      if (last && last.date === n.date) last.items.push(n);
      else groups.push({ date: n.date, items: [n] });
    });

    timelineEl.innerHTML = groups.map(g => `
      <section class="day-group">
        <h2 class="day-head">${dayLabel(g.date)}</h2>
        ${g.items.map(n => {
          const t = TYPE_MAP[n.type];
          const time = TIMES[NEWS.indexOf(n) % TIMES.length];
          const nodeCls = n.status === 'pending' ? 'tl-node pending' : 'tl-node';
          return `
            <div class="tl-item" style="--tc:${t.color}">
              <div class="${nodeCls}"></div>
              <article class="card" onclick="toggleCard(this)">
                <div class="card-top">
                  <span class="card-time">${time} · ${EVENT_NAME[n.event]}</span>
                  <span class="tag-solid">${t.name}</span>
                </div>
                <h3 class="card-title">${n.title}<span class="detail-hint">点击卡片展开详情</span></h3>
                <p class="card-summary">${n.summary}</p>
                <div class="card-foot">
                  <span class="source">来源：${n.source}</span>
                  <a class="src-btn" href="${n.sourceLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看来源 →</a>
                </div>
                <div class="detail">
                  <p>${n.detail.intro}</p>
                  <div class="meta-line"><strong>主创：</strong>${n.detail.cast}</div>
                  <div class="meta-line"><strong>播出：</strong>${n.detail.platform}</div>
                  <div class="meta-line"><strong>规格：</strong>${n.detail.ep}</div>
                </div>
              </article>
            </div>
          `;
        }).join('')}
      </section>
    `).join('');

    observeItems();
  }

  // ============ 点击卡片展开/收起详情 ============
  window.toggleCard = function(card) {
    card.querySelector('.detail').classList.toggle('open');
  };

  // ============ 轮播 Banner ============
  const BANNER_TITLES = ['《深海回响》全国院线上映', '《长安霓裳录》全网首播', '《星海战记》提档至 7 月 28 日首播'];
  const bannerItems = BANNER_TITLES.map(t => NEWS.find(n => n.title === t));
  const slidesEl = document.getElementById('slides');
  const dotsEl = document.getElementById('dots');
  let slideIdx = 0;
  let slideTimer = null;

  slidesEl.innerHTML = bannerItems.map((n, i) => {
    const t = TYPE_MAP[n.type];
    return `
      <div class="slide${i === 0 ? ' on' : ''}" style="background-image:url('${POSTER_MAP[n.title]}')">
        <div class="slide-info">
          <span class="slide-tag" style="background:${t.color}">${t.name}</span>
          <h2>${n.title}</h2>
          <p>${n.summary}</p>
        </div>
      </div>
    `;
  }).join('');
  dotsEl.innerHTML = bannerItems.map((_, i) => `<span class="${i === 0 ? 'on' : ''}" data-i="${i}"></span>`).join('');

  function goSlide(i) {
    slideIdx = (i + bannerItems.length) % bannerItems.length;
    slidesEl.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
    dotsEl.querySelectorAll('span').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
  }
  function startAuto() {
    stopAuto();
    slideTimer = setInterval(() => goSlide(slideIdx + 1), 4000);   // 自动轮播 4 秒
  }
  function stopAuto() { if (slideTimer) clearInterval(slideTimer); }

  document.getElementById('prevBtn').addEventListener('click', () => goSlide(slideIdx - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goSlide(slideIdx + 1));
  dotsEl.querySelectorAll('span').forEach(s => {
    s.addEventListener('click', () => goSlide(Number(s.dataset.i)));
  });
  const bannerEl = document.getElementById('banner');
  bannerEl.addEventListener('mouseenter', stopAuto);   // 悬停暂停
  bannerEl.addEventListener('mouseleave', startAuto);
  startAuto();

  // ============ 侧边栏分类筛选 ============
  document.querySelectorAll('.side-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.side-item').forEach(c => c.classList.remove('active'));
      item.classList.add('active');
      currentType = item.dataset.type;
      render();
    });
  });

  // ============ 时间范围筛选 ============
  document.querySelectorAll('.chip[data-range]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-range]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentRange = chip.dataset.range;
      render();
    });
  });

  // ============ 搜索 ============
  document.getElementById('searchInput').addEventListener('input', (e) => {
    keyword = e.target.value.trim();
    render();
  });

  // ============ 滚动淡入 ============
  let observer;
  function observeItems() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.tl-item').forEach(item => observer.observe(item));
  }

  // ============ 回到顶部 ============
  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) backTop.classList.add('show');
    else backTop.classList.remove('show');
  });
  backTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ============ 初始渲染 ============
  render();
</script>
