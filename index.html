<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视上新快讯 · 每日上新定档速览</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 左侧固定侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <h1>影视上新快讯</h1>
      <p>每日上新 · 定档速览</p>
    </div>
    <div class="side-search">
      <input type="text" id="searchInput" placeholder="搜索作品 / 关键词">
    </div>
    <div class="side-label">内容分类</div>
    <nav id="sideNav">
      <button class="side-item active" data-type="all"><span class="dot" style="background:#1A1F2E"></span>全部</button>
      <button class="side-item" data-type="movie"><span class="dot" style="background:var(--c-movie)"></span>院线电影</button>
      <button class="side-item" data-type="drama"><span class="dot" style="background:var(--c-drama)"></span>电视剧</button>
      <button class="side-item" data-type="show"><span class="dot" style="background:var(--c-show)"></span>综艺</button>
      <button class="side-item" data-type="anime"><span class="dot" style="background:var(--c-anime)"></span>动漫</button>
      <button class="side-item" data-type="doc"><span class="dot" style="background:var(--c-doc)"></span>纪录片</button>
    </nav>
    <div class="side-foot">
      <span class="demo-tag">模拟演示版本</span>
      <p>资讯均为虚构数据，仅供原型演示</p>
    </div>
  </aside>

  <!-- 右侧内容区 -->
  <div class="content">

    <!-- 轮播 Banner -->
    <section class="banner" id="banner">
      <div class="slides" id="slides"></div>
      <button class="banner-arrow prev" id="prevBtn" aria-label="上一个">‹</button>
      <button class="banner-arrow next" id="nextBtn" aria-label="下一个">›</button>
      <div class="banner-dots" id="dots"></div>
    </section>

    <!-- 时间范围筛选 -->
    <section class="range-bar">
      <span class="range-label">时间</span>
      <button class="chip active" data-range="all">全部</button>
      <button class="chip" data-range="week">本周</button>
      <button class="chip" data-range="month">本月</button>
      <button class="chip" data-range="upcoming">即将上线</button>
    </section>

    <!-- 时间线主体 -->
    <main class="timeline" id="timeline"></main>

    <!-- 底部说明 -->
    <footer class="footer">
      <p>本页面影视资讯来自 TMDB（themoviedb.org），API 异常时显示本地模拟数据，仅供演示，不作为实际观影决策依据。</p>
      <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
      <p class="version">Version 0.3</p>
    </footer>
  </div>

  <!-- 回到顶部 -->
  <button class="back-top" id="backTop" aria-label="回到顶部">↑</button>

<script>
  // 数据来自 data.json，加载完成后启动
  let NEWS, POSTER_MAP, TYPE_MAP, EVENT_NAME, TYPE_BG, TYPE_SIDEBAR_BG, TIMES, WEEKDAYS;

  // ============ 状态 ============
  const timelineEl = document.getElementById('timeline');
  let currentType = 'all';
  let currentRange = 'all';
  let keyword = '';

  // 今天基准（用于本周/本月/即将上线判定）
  const TODAY = new Date();

  function inRange(dateStr, range) {
    const d = new Date(dateStr);
    const diffDays = Math.round((d - TODAY) / 86400000);
    if (range === 'week')     return diffDays >= -7 && diffDays <= 0;
    if (range === 'month')    return diffDays >= -30 && diffDays <= 0;
    if (range === 'upcoming') return diffDays > 0;
    return true;
  }

  function dayLabel(dateStr) {
    const d = new Date(dateStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
  }

  // ============ 渲染时间线（按日期分组） ============
  function render() {
    const filtered = NEWS.filter(n => {
      const typeOk = currentType === 'all' || n.type === currentType;
      const rangeOk = inRange(n.date, currentRange);
      const kwOk = !keyword || n.title.includes(keyword) || n.summary.includes(keyword);
      return typeOk && rangeOk && kwOk;
    });

    if (filtered.length === 0) {
      timelineEl.innerHTML = '<div class="empty-tip">当前筛选条件下暂无资讯</div>';
      return;
    }

    // 按日期倒序
    filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

    // 按日期分组：同一天资讯归为一组
    const groups = [];
    filtered.forEach(n => {
      const last = groups[groups.length - 1];
      if (last && last.date === n.date) last.items.push(n);
      else groups.push({ date: n.date, items: [n] });
    });

    timelineEl.innerHTML = groups.map(g => `
      <section class="day-group">
        <h2 class="day-head">${dayLabel(g.date)}</h2>
        ${g.items.map(n => {
          const t = TYPE_MAP[n.type];
          const time = TIMES[NEWS.indexOf(n) % TIMES.length];
          const nodeCls = n.status === 'pending' ? 'tl-node pending' : 'tl-node';
          return `
            <div class="tl-item" style="--tc:${t.color}">
              <div class="${nodeCls}"></div>
              <article class="card" onclick="toggleCard(this)">
                <div class="poster"><img src="${n.poster || POSTER_MAP[n.title]}" alt="${n.title}" loading="lazy"></div>
                <div class="card-main">
                  <div class="card-top">
                    <span class="card-time">${time} · ${EVENT_NAME[n.event]}</span>
                    <span class="tag-solid">${t.name}</span>
                  </div>
                  <h3 class="card-title">${n.title}<span class="detail-hint">点击卡片展开详情</span></h3>
                  <p class="card-summary">${n.summary}</p>
                  <div class="card-foot">
                    <span class="source">来源：${n.source}</span>
                    <a class="src-btn" href="${n.sourceLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看来源 →</a>
                  </div>
                  <div class="detail">
                    <p>${n.detail.intro}</p>
                    <div class="meta-line"><strong>主创：</strong>${n.detail.cast}</div>
                    <div class="meta-line"><strong>播出：</strong>${n.detail.platform}</div>
                    <div class="meta-line"><strong>规格：</strong>${n.detail.ep}</div>
                  </div>
                </div>
              </article>
            </div>
          `;
        }).join('')}
      </section>
    `).join('');

    observeItems();
  }

  // ============ 点击卡片展开/收起详情 ============
  window.toggleCard = function(card) {
    card.querySelector('.detail').classList.toggle('open');
  };

  // ============ 轮播 Banner（使用横版高清大图） ============
  function initBanner() {
  const BANNER_ITEMS = [
    { title: '《深海回响》全国院线上映', img: 'posters/02_shen_hai_wide.jpg' },
    { title: '《长安霓裳录》全网首播',   img: 'posters/01_chang_an_wide.jpg' },
    { title: '《星海战记》提档至 7 月 28 日首播', img: 'posters/08_xing_hai_wide.jpg' }
  ];
  const bannerItems = BANNER_ITEMS.map(b => ({ ...NEWS.find(n => n.title === b.title), wide: b.img }));
  const slidesEl = document.getElementById('slides');
  const dotsEl = document.getElementById('dots');
  let slideIdx = 0;
  let slideTimer = null;

  slidesEl.innerHTML = bannerItems.map((n, i) => {
    const t = TYPE_MAP[n.type];
    return `
      <div class="slide${i === 0 ? ' on' : ''}" style="background-image:url('${n.wide}')">
        <div class="slide-info">
          <span class="slide-tag" style="background:${t.color}">${t.name}</span>
          <h2>${n.title}</h2>
          <p>${n.summary}</p>
        </div>
      </div>
    `;
  }).join('');
  dotsEl.innerHTML = bannerItems.map((_, i) => `<span class="${i === 0 ? 'on' : ''}" data-i="${i}"></span>`).join('');

  function goSlide(i) {
    slideIdx = (i + bannerItems.length) % bannerItems.length;
    slidesEl.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
    dotsEl.querySelectorAll('span').forEach((s, k) => s.classList.toggle('on', k === slideIdx));
  }
  function startAuto() {
    stopAuto();
    slideTimer = setInterval(() => goSlide(slideIdx + 1), 4000);   // 自动轮播 4 秒
  }
  function stopAuto() { if (slideTimer) clearInterval(slideTimer); }

  document.getElementById('prevBtn').addEventListener('click', () => goSlide(slideIdx - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goSlide(slideIdx + 1));
  dotsEl.querySelectorAll('span').forEach(s => {
    s.addEventListener('click', () => goSlide(Number(s.dataset.i)));
  });
  const bannerEl = document.getElementById('banner');
  bannerEl.addEventListener('mouseenter', stopAuto);   // 悬停暂停
  bannerEl.addEventListener('mouseleave', startAuto);
  startAuto();
  }

  // ============ 侧边栏分类筛选（切换时页面背景变为品类主题浅色调） ============
  document.querySelectorAll('.side-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.side-item').forEach(c => c.classList.remove('active'));
      item.classList.add('active');
      currentType = item.dataset.type;
      document.body.style.background = TYPE_BG[currentType] || TYPE_BG.all;
      document.querySelector('.sidebar').style.background = TYPE_SIDEBAR_BG[currentType] || TYPE_SIDEBAR_BG.all;
      render();
    });
  });

  // ============ 时间范围筛选 ============
  document.querySelectorAll('.chip[data-range]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-range]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentRange = chip.dataset.range;
      render();
    });
  });

  // ============ 搜索 ============
  document.getElementById('searchInput').addEventListener('input', (e) => {
    keyword = e.target.value.trim();
    render();
  });

  // ============ 滚动淡入 ============
  let observer;
  function observeItems() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.tl-item').forEach(item => observer.observe(item));
  }

  // ============ 回到顶部 ============
  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) backTop.classList.add('show');
    else backTop.classList.remove('show');
  });
  backTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ============ 加载数据并启动 ============
  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      ({ NEWS, POSTER_MAP, TYPE_MAP, EVENT_NAME, TYPE_BG, TYPE_SIDEBAR_BG, TIMES, WEEKDAYS } = data);
      // 尝试加载 TMDB 真实数据，失败时保留本地模拟数据
      return fetch('/api/tmdb')
        .then(r => r.json())
        .then(t => {
          if (t && t.code === 0 && t.data && t.data.length) NEWS = t.data;
        })
        .catch(() => {});
    })
    .then(() => {
      initBanner();
      render();
    });
</script>
</body>
</html>
